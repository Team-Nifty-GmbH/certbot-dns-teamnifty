[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-teamnifty"
version = "0.1.0"
description = "Certbot DNS-01 authenticator plugin for Flux ERP DNS (dns-01 API)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Team Nifty GmbH" }]
dependencies = ["certbot>=2.0", "requests"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/Team-Nifty-GmbH/certbot-dns-teamnifty"

[project.entry-points."certbot.plugins"]
dns-teamnifty = "certbot_dns_teamnifty._internal.dns_teamnifty:Authenticator"

[tool.setuptools.packages.find]
include = ["certbot_dns_teamnifty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
